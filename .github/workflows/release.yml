name: Publish v1.0.0 Release
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RELEASE-1.0.0 after security and privacy checks"
        required: true
        type: string
permissions: {}
jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      inputs.confirmation == 'RELEASE-1.0.0' &&
      vars.PUBLIC_RELEASE_APPROVED == 'true' &&
      vars.LIVE_PUBLISH != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test and audit tools
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt pip-audit bandit
      - name: Verify Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify dependencies
        run: python3 -m pip_audit -r requirements.txt --strict
      - name: Verify Python source
        run: python3 -m bandit -r scripts -ll
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 \
            --title "PostForge AI v1.0.0" \
            --notes-file CHANGELOG.md \
            --target "$GITHUB_SHA"
