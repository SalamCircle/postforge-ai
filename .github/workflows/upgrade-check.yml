name: V2 alpha tests
on:
  push:
    branches: [v2-alpha]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
