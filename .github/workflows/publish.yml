name: PostForge Publisher
on:
  push:
    branches: [main]
    paths: ['queue/*.json']
  workflow_dispatch:
  schedule:
    - cron: '0 8,9 * * *'
permissions: {}
concurrency:
  group: postforge-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - run: python3 -m pip install -r requirements.txt
      - name: Verify regression tests before publishing
        run: python3 -m unittest discover -s tests -v
      - run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(TZ=Europe/London date +%H)" != 09 ]; then
            echo 'Outside 9 AM UK scheduled window; skipping'
            exit 0
          fi
          git config user.name 'postforge-bot'
          git config user.email 'postforge-bot@users.noreply.github.com'
          python3 scripts/publish.py
        env:
          LIVE_PUBLISH: ${{ vars.LIVE_PUBLISH }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
