name: Pro live release acceptance (no publication)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Confirm free-only provider accounts and included runner minutes: type VERIFY FREE AI'
        required: true
        type: string
      style:
        description: 'Local graphic or optional live AI artwork (requires configured dedicated Workers Free account)'
        type: choice
        options:
          - original
          - ai-illustration
        default: original
        required: true
permissions:
  contents: read
jobs:
  acceptance:
    if: github.event.repository.private && github.ref == 'refs/heads/main' && inputs.confirmation == 'VERIFY FREE AI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -m pip install -r requirements.txt
      - name: Exercise current Pro runtime in temporary workspace
        env:
          ACCEPTANCE_STYLE: ${{ inputs.style }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PRO_AI_MODEL: ${{ vars.PRO_AI_MODEL || 'openai/gpt-oss-20b' }}
          PRO_IMAGE_ENABLED: ${{ vars.PRO_IMAGE_ENABLED }}
          PRO_IMAGE_FREE_ONLY: ${{ vars.PRO_IMAGE_FREE_ONLY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_IMAGE_TOKEN: ${{ secrets.CLOUDFLARE_IMAGE_TOKEN }}
          LIVE_PUBLISH: 'false'
          LINKEDIN_ACCESS_TOKEN: ''
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m scripts.pro_acceptance
