name: Security Audit
on:
  push:
    branches: [v2-alpha]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install free security scanners
        run: python3 -m pip install --disable-pip-version-check pip-audit bandit
      - name: Dependency vulnerability scan
        run: python3 -m pip_audit -r requirements.txt --strict
      - name: Review all Bandit findings (informational)
        run: python3 -m bandit -r scripts --exit-zero
      - name: Enforce no medium or high findings
        run: python3 -m bandit -r scripts -ll
      - name: Verify patched V2 artwork and regression tests offline
        env:
          LIVE_PUBLISH: 'false'
          LINKEDIN_ACCESS_TOKEN: ''
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          import io
          from PIL import Image
          from scripts.publish import render_v2_assets
          data = render_v2_assets()
          with Image.open(io.BytesIO(data)) as image:
              assert image.format == "JPEG"
              assert image.size == (1280, 1000)
              image.verify()
          print("Patched V2 artwork conversion passed")
          PY
