<svg xmlns="http://www.w3.org/2000/svg" width="640" height="509" viewBox="0 0 640 509" role="img" aria-labelledby="title"><title id="title">Temporary editing authorization</title><rect x="1" y="1" width="638" height="507" rx="18" fill="#f8fafc" stroke="#dbe4ef"/><g font-family="Arial,sans-serif"><text x="32" y="32" font-size="16" fill="#0a66c2" font-weight="700">POSTFORGE AI / MORE / WORKSPACE SETTINGS</text><text x="32" y="76" font-size="28" fill="#172435" font-weight="700">Temporary editing authorization</text><path d="M32 98H608" stroke="#dbe4ef"/><text x="32" y="142" font-size="19" fill="#526174">Editing token</text><rect x="32" y="155" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="186" font-size="21" fill="#172435">Enter your separate editing token privately</text><text x="32" y="239" font-size="19" fill="#526174">Editing duration</text><rect x="32" y="252" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="283" font-size="21" fill="#172435">15 minutes (default)</text><path d="M574 272l9 9 9 -9" fill="none" stroke="#435770" stroke-width="2"/><rect x="32" y="322" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="340" font-size="19" fill="#172435">Remember encrypted editing authorization</text><rect x="32" y="364" width="23" height="23" rx="4" fill="#0a66c2" stroke="#a8b7c7"/><path d="M37 375l5 5 9 -11" stroke="white" fill="none" stroke-width="2.5"/><text x="68" y="382" font-size="19" fill="#172435">Review each action and return to read only</text><rect x="32" y="408" width="576" height="52" rx="26" fill="#0a66c2"/><text x="320" text-anchor="middle" y="441" font-size="21" fill="#fff" font-weight="700">Authorize editing</text><text x="32" y="484" font-size="15" fill="#64748b">Illustrative form · open the linked page to act</text></g></svg>
