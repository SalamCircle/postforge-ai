<svg xmlns="http://www.w3.org/2000/svg" width="720" height="754" viewBox="0 0 720 754" role="img"><title>What makes Core useful?</title><rect x="1" y="1" width="718" height="752" rx="22" fill="#ffffff" stroke="#dce5ef"/><text x="32" y="39" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0877c9">POSTFORGE AI V2  /  CONTENT STUDIO</text><text x="32" y="84" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#15283e">What makes Core useful?</text><text x="32" y="116" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Development capabilities • No extra LinkedIn API for Core.</text><rect x="32" y="145" width="656" height="48" rx="8" fill="#f5f8fc" stroke="#e5ebf2"/><text x="45" y="175" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Brand profile</text><text x="285" y="175" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Persistent audience, voice and goals</text><rect x="32" y="199" width="656" height="48" rx="8" fill="#fff" stroke="#e5ebf2"/><text x="45" y="229" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Monthly planning</text><text x="285" y="229" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Import up to 30 draft proposals</text><rect x="32" y="253" width="656" height="48" rx="8" fill="#f5f8fc" stroke="#e5ebf2"/><text x="45" y="283" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Source tracking</text><text x="285" y="283" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">References stored with drafts</text><rect x="32" y="307" width="656" height="48" rx="8" fill="#fff" stroke="#e5ebf2"/><text x="45" y="337" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Topic warnings</text><text x="285" y="337" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Matching-topic repetition checks</text><rect x="32" y="361" width="656" height="48" rx="8" fill="#f5f8fc" stroke="#e5ebf2"/><text x="45" y="391" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Content series</text><text x="285" y="391" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Group related posts</text><rect x="32" y="415" width="656" height="48" rx="8" fill="#fff" stroke="#e5ebf2"/><text x="45" y="445" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Draft management</text><text x="285" y="445" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Create, revise, review, archive</text><rect x="32" y="469" width="656" height="48" rx="8" fill="#f5f8fc" stroke="#e5ebf2"/><text x="45" y="499" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Content approval</text><text x="285" y="499" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Bound to the exact content digest</text><rect x="32" y="523" width="656" height="48" rx="8" fill="#fff" stroke="#e5ebf2"/><text x="45" y="553" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Calendar</text><text x="285" y="553" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">1–90 day views</text><rect x="32" y="577" width="656" height="48" rx="8" fill="#f5f8fc" stroke="#e5ebf2"/><text x="45" y="607" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Recycling</text><text x="285" y="607" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Briefs from published studio drafts</text><rect x="32" y="631" width="656" height="48" rx="8" fill="#fff" stroke="#e5ebf2"/><text x="45" y="661" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#15283e">Reliability</text><text x="285" y="661" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Duplicate checks and receipt reports</text><text x="32" y="713" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#536579">Core under verification. Advanced API actions remain unreleased.</text><text x="32" y="735" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#536579">No automatic feed discovery, exact-minute scheduling or web dashboard.</text></svg>