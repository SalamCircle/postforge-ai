<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img"><title>Ask your AI. Build your plan.</title><rect x="1" y="1" width="718" height="528" rx="22" fill="#ffffff" stroke="#dce5ef"/><text x="32" y="39" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0877c9">POSTFORGE AI V2  /  CONTENT STUDIO</text><text x="32" y="84" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#15283e">Ask your AI. Build your plan.</text><text x="32" y="116" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Example instruction for your connected assistant.</text><rect x="32" y="145" width="656" height="329" rx="16" fill="#f7faff" stroke="#dce5ef"/><text x="54" y="184" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#15283e">Act as my personal content strategist using</text><text x="54" y="215" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#15283e">PostForge AI V2 Content Studio.</text><text x="54" y="246" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#15283e">Read my brand profile, goals, previous posts,</text><text x="54" y="277" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#15283e">calendar and recorded research sources.</text><text x="54" y="308" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#15283e">Create a 30-day LinkedIn strategy. Research</text><text x="54" y="339" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#15283e">reliable sources, avoid repeated topics and</text><text x="54" y="370" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#15283e">organise related ideas into content series.</text><text x="54" y="401" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#15283e">Save the results as drafts. Do not approve</text><text x="54" y="432" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#15283e">or publish anything until I have reviewed it.</text><text x="32" y="507" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#0877c9">Use the copyable prompt in the guide below.</text></svg>