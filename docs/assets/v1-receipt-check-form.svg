<svg xmlns="http://www.w3.org/2000/svg" width="640" height="606" viewBox="0 0 640 606" role="img" aria-labelledby="title"><title id="title">Check the publication receipt</title><rect x="1" y="1" width="638" height="604" rx="18" fill="#f8fafc" stroke="#dbe4ef"/><g font-family="Arial,sans-serif"><text x="32" y="32" font-size="16" fill="#0a66c2" font-weight="700">POSTFORGE / STATE / LINKEDIN</text><text x="32" y="76" font-size="28" fill="#172435" font-weight="700">Check the publication receipt</text><path d="M32 98H608" stroke="#dbe4ef"/><text x="32" y="142" font-size="19" fill="#526174">Receipt status</text><rect x="32" y="155" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="186" font-size="21" fill="#172435">published (example)</text><text x="32" y="239" font-size="19" fill="#526174">Post ID</text><rect x="32" y="252" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="283" font-size="21" fill="#172435">urn:li:share:EXAMPLE</text><text x="32" y="336" font-size="19" fill="#526174">Visual</text><rect x="32" y="349" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="380" font-size="21" fill="#172435">true (for an image-backed post)</text><rect x="32" y="419" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="437" font-size="19" fill="#172435">Actual LinkedIn post matches reviewed content</text><rect x="32" y="461" width="23" height="23" rx="4" fill="#0a66c2" stroke="#a8b7c7"/><path d="M37 472l5 5 9 -11" stroke="white" fill="none" stroke-width="2.5"/><text x="68" y="479" font-size="19" fill="#172435">Uncertain claim? Stop and investigate</text><rect x="32" y="505" width="576" height="52" rx="26" fill="#0a66c2"/><text x="320" text-anchor="middle" y="538" font-size="21" fill="#fff" font-weight="700">Open LinkedIn feed</text><text x="32" y="581" font-size="15" fill="#64748b">Illustrative form · open the linked page to act</text></g></svg>
