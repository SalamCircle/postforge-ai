<svg xmlns="http://www.w3.org/2000/svg" width="720" height="802" viewBox="0 0 720 802" role="img"><title>From idea to publication.</title><rect x="1" y="1" width="718" height="800" rx="22" fill="#ffffff" stroke="#dce5ef"/><text x="32" y="39" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#0877c9">POSTFORGE AI V2  /  CONTENT STUDIO</text><text x="32" y="84" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#15283e">From idea to publication.</text><text x="32" y="116" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">A repeatable workflow built around your brand.</text><rect x="32" y="145" width="656" height="83" rx="14" fill="#f7faff" stroke="#dce5ef"/><rect x="48" y="162" width="48" height="48" rx="12" fill="#e4f3ff" stroke="#e4f3ff"/><text x="62" y="193" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0877c9">01</text><text x="114" y="177" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#15283e">Understand your brand</text><text x="114" y="205" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Read stored audience, style and goals.</text><path d="M72 228v15m-5-5 5 5 5-5" stroke="#8ba5bc" stroke-width="2" fill="none"/><rect x="32" y="246" width="656" height="83" rx="14" fill="#f7faff" stroke="#dce5ef"/><rect x="48" y="263" width="48" height="48" rx="12" fill="#e4f3ff" stroke="#e4f3ff"/><text x="62" y="294" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0877c9">02</text><text x="114" y="278" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#15283e">Research and plan</text><text x="114" y="306" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Your connected AI proposes relevant ideas.</text><path d="M72 329v15m-5-5 5 5 5-5" stroke="#8ba5bc" stroke-width="2" fill="none"/><rect x="32" y="347" width="656" height="83" rx="14" fill="#f7faff" stroke="#dce5ef"/><rect x="48" y="364" width="48" height="48" rx="12" fill="#e4f3ff" stroke="#e4f3ff"/><text x="62" y="395" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0877c9">03</text><text x="114" y="379" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#15283e">Store drafts</text><text x="114" y="407" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Import content without publishing it.</text><path d="M72 430v15m-5-5 5 5 5-5" stroke="#8ba5bc" stroke-width="2" fill="none"/><rect x="32" y="448" width="656" height="83" rx="14" fill="#f7faff" stroke="#dce5ef"/><rect x="48" y="465" width="48" height="48" rx="12" fill="#e4f3ff" stroke="#e4f3ff"/><text x="62" y="496" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0877c9">04</text><text x="114" y="480" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#15283e">Review and approve</text><text x="114" y="508" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Approval applies to the exact reviewed draft.</text><path d="M72 531v15m-5-5 5 5 5-5" stroke="#8ba5bc" stroke-width="2" fill="none"/><rect x="32" y="549" width="656" height="83" rx="14" fill="#f7faff" stroke="#dce5ef"/><rect x="48" y="566" width="48" height="48" rx="12" fill="#e4f3ff" stroke="#e4f3ff"/><text x="62" y="597" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0877c9">05</text><text x="114" y="581" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#15283e">Publish</text><text x="114" y="609" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Use your existing LinkedIn publishing engine.</text><path d="M72 632v15m-5-5 5 5 5-5" stroke="#8ba5bc" stroke-width="2" fill="none"/><rect x="32" y="650" width="656" height="83" rx="14" fill="#f7faff" stroke="#dce5ef"/><rect x="48" y="667" width="48" height="48" rx="12" fill="#e4f3ff" stroke="#e4f3ff"/><text x="62" y="698" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0877c9">06</text><text x="114" y="682" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#15283e">Monitor and improve</text><text x="114" y="710" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#536579">Track receipts, missed posts and reuse ideas.</text><text x="32" y="780" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#536579">Development workflow • User review before queue export</text></svg>