<svg xmlns="http://www.w3.org/2000/svg" width="640" height="696" viewBox="0 0 640 696" role="img" aria-labelledby="title"><title id="title">Connect your workspace</title><rect x="1" y="1" width="638" height="694" rx="18" fill="#f8fafc" stroke="#dbe4ef"/><g font-family="Arial,sans-serif"><text x="32" y="32" font-size="16" fill="#0a66c2" font-weight="700">POSTFORGE AI / CONNECT</text><text x="32" y="76" font-size="28" fill="#172435" font-weight="700">Connect your workspace</text><path d="M32 98H608" stroke="#dbe4ef"/><text x="32" y="135" font-size="19" fill="#526174">GitHub owner/repository</text><rect x="32" y="148" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="179" font-size="21" fill="#172435">YOUR-OWNER/YOUR-PRIVATE-REPO</text><text x="32" y="232" font-size="19" fill="#526174">GitHub fine-grained token</text><rect x="32" y="245" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="276" font-size="21" fill="#172435">Paste your dedicated read-only token</text><text x="32" y="329" font-size="19" fill="#526174">Workspace</text><rect x="32" y="342" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="373" font-size="21" fill="#172435">Installed main</text><path d="M574 362l9 9 9 -9" fill="none" stroke="#435770" stroke-width="2"/><rect x="32" y="412" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="430" font-size="19" fill="#172435">Start a temporary editing session</text><rect x="32" y="454" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="472" font-size="19" fill="#172435">Remember encrypted read-only connection</text><text x="32" y="510" font-size="19" fill="#526174">Device passphrase (only if saving)</text><rect x="32" y="523" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="554" font-size="21" fill="#172435">Use a unique passphrase of 12+ characters</text><rect x="32" y="595" width="576" height="52" rx="26" fill="#0a66c2"/><text x="320" text-anchor="middle" y="628" font-size="21" fill="#fff" font-weight="700">Connect</text><text x="32" y="671" font-size="15" fill="#64748b">Illustrative form · open the linked official page</text></g></svg>
