<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790"><rect x="1" y="1" width="998" height="788" rx="24" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="48" y="48" fill="#2563eb" font-size="19" font-weight="bold" letter-spacing="2">POSTFORGE AI / QUICK START</text><text x="48" y="101" fill="#14233b" font-size="42" font-weight="bold">From setup to your first post.</text><text x="48" y="135" fill="#52647b" font-size="22">Five simple steps. Your AI. Your timing.</text><rect x="48" y="160" width="904" height="88" rx="14" fill="#f6f9fd" stroke="#dce6f3"/><rect x="66" y="180" width="48" height="48" rx="12" fill="#e3edff"/><text x="90" y="211" text-anchor="middle" font-size="21" font-weight="bold" fill="#2459bd">01</text><text x="134" y="194" font-size="25" font-weight="bold" fill="#14233b">Create a private repository</text><text x="134" y="224" font-size="20" fill="#52647b">Copy the community edition into your own private deployment.</text><rect x="48" y="265" width="904" height="88" rx="14" fill="#f6f9fd" stroke="#dce6f3"/><rect x="66" y="285" width="48" height="48" rx="12" fill="#e3edff"/><text x="90" y="316" text-anchor="middle" font-size="21" font-weight="bold" fill="#2459bd">02</text><text x="134" y="299" font-size="25" font-weight="bold" fill="#14233b">Connect LinkedIn API</text><text x="134" y="329" font-size="20" fill="#52647b">Create an app, enable both products and generate your token.</text><rect x="48" y="370" width="904" height="88" rx="14" fill="#f6f9fd" stroke="#dce6f3"/><rect x="66" y="390" width="48" height="48" rx="12" fill="#e3edff"/><text x="90" y="421" text-anchor="middle" font-size="21" font-weight="bold" fill="#2459bd">03</text><text x="134" y="404" font-size="25" font-weight="bold" fill="#14233b">Add repository secret</text><text x="134" y="434" font-size="20" fill="#52647b">LINKEDIN_ACCESS_TOKEN  =  your private OAuth token</text><rect x="48" y="475" width="904" height="88" rx="14" fill="#f6f9fd" stroke="#dce6f3"/><rect x="66" y="495" width="48" height="48" rx="12" fill="#e3edff"/><text x="90" y="526" text-anchor="middle" font-size="21" font-weight="bold" fill="#2459bd">04</text><text x="134" y="509" font-size="25" font-weight="bold" fill="#14233b">Test safely, then enable live mode</text><text x="134" y="539" font-size="20" fill="#52647b">Actions → Variables → LIVE_PUBLISH = true (after dry run)</text><rect x="48" y="580" width="904" height="88" rx="14" fill="#f6f9fd" stroke="#dce6f3"/><rect x="66" y="600" width="48" height="48" rx="12" fill="#e3edff"/><text x="90" y="631" text-anchor="middle" font-size="21" font-weight="bold" fill="#2459bd">05</text><text x="134" y="614" font-size="25" font-weight="bold" fill="#14233b">Choose your AI and publish</text><text x="134" y="644" font-size="20" fill="#52647b">Draft with any LLM. Publish now or schedule for later.</text><rect x="48" y="695" width="904" height="49" rx="12" fill="#eaf2ff"/><text x="500" y="726" text-anchor="middle" font-size="21" font-weight="bold" fill="#174ba8">Publish on demand  ·  Schedule daily  ·  MIT open source</text><text x="48" y="768" font-size="16" fill="#52647b">Use the clickable setup links below. Provider quotas and optional fees may apply.</text></g></svg>