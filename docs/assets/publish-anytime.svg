<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="1000" height="590" rx="24" fill="#0c1d34"/><g font-family="Arial,sans-serif" fill="#fff"><text x="48" y="55" font-size="22" fill="#79ddeb" font-weight="bold">POSTFORGE AI / COMMUNITY EDITION</text><text x="48" y="112" font-size="40" font-weight="bold">Your AI. Your content. Your timing.</text><rect x="48" y="148" width="904" height="92" rx="16" fill="#183b54"/><text x="72" y="185" font-size="25" font-weight="bold">01  Choose any LLM to draft your post</text><text x="72" y="216" font-size="19" fill="#c5dce8">ChatGPT, Gemini, Claude, local models or your own writing</text><path d="M500 240v32" stroke="#79ddeb" stroke-width="3"/><rect x="48" y="272" width="440" height="125" rx="16" fill="#183b54"/><rect x="512" y="272" width="440" height="125" rx="16" fill="#183b54"/><text x="72" y="310" font-size="25" font-weight="bold">02A  Publish on demand</text><text x="72" y="343" font-size="19">Queue today's post or run manually.</text><text x="72" y="370" font-size="19" fill="#79ddeb">Any time, subject to API limits.</text><text x="536" y="310" font-size="25" font-weight="bold">02B  Schedule ahead</text><text x="536" y="343" font-size="19">Queue a future date.</text><text x="536" y="370" font-size="19" fill="#79ddeb">Daily at 9 AM UK by default.</text><path d="M268 397v20h464v-20M500 417v23" stroke="#79ddeb" stroke-width="3" fill="none"/><rect x="48" y="440" width="904" height="76" rx="16" fill="#235a75"/><text x="72" y="473" font-size="24" font-weight="bold">03  Validate → LinkedIn API → publication receipt</text><text x="72" y="499" font-size="18">Private deployment • explicit opt-in • duplicate protection</text><text x="48" y="550" font-size="19" font-weight="bold" fill="#79ddeb">FREE MIT SOFTWARE</text><text x="48" y="575" font-size="17" fill="#c5dce8">AI providers and hosting may have usage limits or separate charges.</text></g></svg>