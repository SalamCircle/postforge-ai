<svg xmlns="http://www.w3.org/2000/svg" width="640" height="476" viewBox="0 0 640 476" role="img" aria-labelledby="title"><title id="title">Recover exposed credentials</title><rect x="1" y="1" width="638" height="474" rx="18" fill="#f8fafc" stroke="#dbe4ef"/><g font-family="Arial,sans-serif"><text x="32" y="32" font-size="16" fill="#0a66c2" font-weight="700">SECURITY / REVOCATION CHECKLIST</text><text x="32" y="76" font-size="28" fill="#172435" font-weight="700">Recover exposed credentials</text><path d="M32 98H608" stroke="#dbe4ef"/><rect x="32" y="121" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="139" font-size="19" fill="#172435">Stop live and scheduled publishing</text><rect x="32" y="163" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="181" font-size="19" fill="#172435">Revoke exposed LinkedIn authorisation</text><rect x="32" y="205" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="223" font-size="19" fill="#172435">Rotate any exposed GitHub/provider key</text><rect x="32" y="247" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="265" font-size="19" fill="#172435">Create replacement LinkedIn app if needed</text><rect x="32" y="289" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="307" font-size="19" fill="#172435">Replace secret in your private repository</text><rect x="32" y="331" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="349" font-size="19" fill="#172435">Check claims and published posts; no blind retry</text><rect x="32" y="375" width="576" height="52" rx="26" fill="#0a66c2"/><text x="320" text-anchor="middle" y="408" font-size="21" fill="#fff" font-weight="700">Open LinkedIn permitted services</text><text x="32" y="451" font-size="15" fill="#64748b">Illustrative form · open the linked official page</text></g></svg>
