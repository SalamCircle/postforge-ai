<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550"><rect width="100%" height="100%" rx="20" fill="#10243b"/><g font-family="Arial,sans-serif"><text x="32" y="48" font-size="27" font-weight="bold" fill="white">Setup checklist — illustrated guide</text><rect x="32" y="76" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="103" font-size="19" font-weight="bold" fill="#10243b">01  Create a private deployment</text><text x="52" y="128" font-size="16" fill="#34546a">Copy the source; never store credentials in the community repository.</text><rect x="32" y="164" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="191" font-size="19" font-weight="bold" fill="#10243b">02  LinkedIn developer app</text><text x="52" y="216" font-size="16" fill="#34546a">Products → request Share on LinkedIn and OpenID Connect.</text><rect x="32" y="252" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="279" font-size="19" font-weight="bold" fill="#10243b">03  OAuth permissions</text><text x="52" y="304" font-size="16" fill="#34546a">openid · profile · w_member_social</text><rect x="32" y="340" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="367" font-size="19" font-weight="bold" fill="#10243b">04  GitHub Actions secret</text><text x="52" y="392" font-size="16" fill="#34546a">LINKEDIN_ACCESS_TOKEN = your own token (never commit it).</text><rect x="32" y="428" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="455" font-size="19" font-weight="bold" fill="#10243b">05  Safe default</text><text x="52" y="480" font-size="16" fill="#34546a">Leave LIVE_PUBLISH unset; verify billing and run Tests.</text></g></svg>