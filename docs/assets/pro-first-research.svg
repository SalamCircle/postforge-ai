<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1089" viewBox="0 0 640 1089" role="img" aria-labelledby="title"><title id="title">Create with AI</title><rect x="1" y="1" width="638" height="1087" rx="18" fill="#f8fafc" stroke="#dbe4ef"/><g font-family="Arial,sans-serif"><text x="32" y="32" font-size="16" fill="#0a66c2" font-weight="700">POSTFORGE AI / RESEARCH &amp; AI</text><text x="32" y="78" font-size="30" fill="#172435" font-weight="700">Create with AI</text><path d="M32 99H608" stroke="#dbe4ef"/><text x="32" y="144" font-size="19" fill="#526174">Topic</text><rect x="32" y="157" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="188" font-size="21" fill="#172435">Free cybersecurity learning</text><text x="32" y="241" font-size="19" fill="#526174">What should the post say?</text><rect x="32" y="254" width="576" height="88" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="285" font-size="21" fill="#172435">Find an official free learning resource.</text><text x="46" y="310" font-size="21" fill="#172435">Explain the benefits and include a link.</text><text x="32" y="376" font-size="19" fill="#526174">Official source domains (optional)</text><rect x="32" y="389" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="420" font-size="21" fill="#172435">portswigger.net</text><text x="32" y="473" font-size="19" fill="#526174">Automation mode</text><rect x="32" y="486" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="517" font-size="21" fill="#172435">Require approval (recommended)</text><path d="M574 506l9 9 9 -9" fill="none" stroke="#435770" stroke-width="2"/><text x="32" y="570" font-size="19" fill="#526174">Visual preference</text><rect x="32" y="583" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="614" font-size="21" fill="#172435">Original generated graphic</text><path d="M574 603l9 9 9 -9" fill="none" stroke="#435770" stroke-width="2"/><text x="32" y="667" font-size="19" fill="#526174">Publication date</text><rect x="32" y="680" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="711" font-size="21" fill="#172435">Choose your intended date</text><text x="32" y="764" font-size="19" fill="#526174">Time (optional)</text><rect x="32" y="777" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="808" font-size="21" fill="#172435">Leave blank for date-only</text><text x="32" y="861" font-size="19" fill="#526174">Time zone</text><rect x="32" y="874" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="905" font-size="21" fill="#172435">Europe/London</text><rect x="32" y="944" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="962" font-size="19" fill="#172435">Share my stored brand memory</text><rect x="32" y="989" width="576" height="52" rx="26" fill="#0a66c2"/><text x="320" text-anchor="middle" y="1023" font-size="21" fill="#fff" font-weight="700">Research and generate draft</text><text x="32" y="1064" font-size="15" fill="#64748b">Illustrative form · use the linked official page</text></g></svg>
