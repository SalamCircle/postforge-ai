<svg xmlns="http://www.w3.org/2000/svg" width="640" height="689" viewBox="0 0 640 689" role="img" aria-labelledby="title"><title id="title">Create a LinkedIn app</title><rect x="1" y="1" width="638" height="687" rx="18" fill="#f8fafc" stroke="#dbe4ef"/><g font-family="Arial,sans-serif"><text x="32" y="32" font-size="16" fill="#0a66c2" font-weight="700">LINKEDIN DEVELOPERS / CREATE APP</text><text x="32" y="76" font-size="28" fill="#172435" font-weight="700">Create a LinkedIn app</text><path d="M32 98H608" stroke="#dbe4ef"/><text x="32" y="135" font-size="19" fill="#526174">App name</text><rect x="32" y="148" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="179" font-size="21" fill="#172435">My PostForge AI Publisher</text><text x="32" y="232" font-size="19" fill="#526174">LinkedIn Page</text><rect x="32" y="245" width="576" height="85" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="276" font-size="21" fill="#172435">Default Company Page for Individual Developer</text><text x="46" y="301" font-size="21" fill="#172435">(if offered; otherwise your eligible Page)</text><text x="32" y="364" font-size="19" fill="#526174">Privacy policy URL</text><rect x="32" y="377" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="408" font-size="21" fill="#172435">Your applicable public privacy policy</text><text x="32" y="461" font-size="19" fill="#526174">App logo</text><rect x="32" y="474" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="505" font-size="21" fill="#172435">Upload your square logo (100 px or larger)</text><rect x="32" y="544" width="23" height="23" rx="4" fill="white" stroke="#a8b7c7"/><text x="68" y="562" font-size="19" fill="#172435">Read and agree to API terms yourself</text><rect x="32" y="588" width="576" height="52" rx="26" fill="#0a66c2"/><text x="320" text-anchor="middle" y="621" font-size="21" fill="#fff" font-weight="700">Open Developer Portal</text><text x="32" y="664" font-size="15" fill="#64748b">Illustrative form · open the linked official page</text></g></svg>
