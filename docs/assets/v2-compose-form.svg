<svg xmlns="http://www.w3.org/2000/svg" width="640" height="851" viewBox="0 0 640 851" role="img" aria-labelledby="title"><title id="title">Create a new draft</title><rect x="1" y="1" width="638" height="849" rx="18" fill="#f8fafc" stroke="#dbe4ef"/><g font-family="Arial,sans-serif"><text x="32" y="32" font-size="16" fill="#0a66c2" font-weight="700">POSTFORGE AI / DRAFTS</text><text x="32" y="76" font-size="28" fill="#172435" font-weight="700">Create a new draft</text><path d="M32 98H608" stroke="#dbe4ef"/><text x="32" y="142" font-size="19" fill="#526174">Title</text><rect x="32" y="155" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="186" font-size="21" fill="#172435">Your post title</text><text x="32" y="239" font-size="19" fill="#526174">Topic</text><rect x="32" y="252" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="283" font-size="21" fill="#172435">Your chosen topic</text><text x="32" y="336" font-size="19" fill="#526174">Post text</text><rect x="32" y="349" width="576" height="88" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="380" font-size="21" fill="#172435">Enter the content you want to review.</text><text x="46" y="406" font-size="21" fill="#172435">Check claims and source permissions.</text><text x="32" y="471" font-size="19" fill="#526174">Publication date</text><rect x="32" y="484" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="515" font-size="21" fill="#172435">Choose a date</text><text x="32" y="568" font-size="19" fill="#526174">Time (optional)</text><rect x="32" y="581" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="612" font-size="21" fill="#172435">Choose a time or leave blank</text><text x="32" y="665" font-size="19" fill="#526174">Time zone</text><rect x="32" y="678" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="709" font-size="21" fill="#172435">Europe/London (example)</text><rect x="32" y="750" width="576" height="52" rx="26" fill="#0a66c2"/><text x="320" text-anchor="middle" y="783" font-size="21" fill="#fff" font-weight="700">Save draft only</text><text x="32" y="826" font-size="15" fill="#64748b">Illustrative form · open the linked page to act</text></g></svg>
