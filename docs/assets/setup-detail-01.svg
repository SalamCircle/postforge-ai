<svg xmlns="http://www.w3.org/2000/svg" width="640" height="654" viewBox="0 0 640 654" role="img" aria-labelledby="title"><title id="title">Create a private repository</title><rect x="1" y="1" width="638" height="652" rx="18" fill="#f8fafc" stroke="#dbe4ef"/><g font-family="Arial,sans-serif"><text x="32" y="32" font-size="16" fill="#0a66c2" font-weight="700">GITHUB / NEW REPOSITORY</text><text x="32" y="76" font-size="28" fill="#172435" font-weight="700">Create a private repository</text><path d="M32 98H608" stroke="#dbe4ef"/><text x="32" y="135" font-size="19" fill="#526174">Owner</text><rect x="32" y="148" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="179" font-size="21" fill="#172435">Your GitHub account or organisation</text><path d="M574 168l9 9 9 -9" fill="none" stroke="#435770" stroke-width="2"/><text x="32" y="232" font-size="19" fill="#526174">Repository name</text><rect x="32" y="245" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="276" font-size="21" fill="#172435">postforge-ai-private (example)</text><text x="32" y="329" font-size="19" fill="#526174">Visibility</text><rect x="32" y="342" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="373" font-size="21" fill="#172435">Private</text><path d="M574 362l9 9 9 -9" fill="none" stroke="#435770" stroke-width="2"/><text x="32" y="426" font-size="19" fill="#526174">Source</text><rect x="32" y="439" width="576" height="50" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="46" y="470" font-size="21" fill="#172435">Reviewed PostForge distribution</text><rect x="32" y="509" width="23" height="23" rx="4" fill="#0a66c2" stroke="#a8b7c7"/><path d="M37 520l5 5 9 -11" stroke="white" fill="none" stroke-width="2.5"/><text x="68" y="527" font-size="19" fill="#172435">Do not copy another user's private data</text><rect x="32" y="553" width="576" height="52" rx="26" fill="#0a66c2"/><text x="320" text-anchor="middle" y="586" font-size="21" fill