t</text><rect x="32" y="685" width="576" height="52" rx="26" fill="#0a66c2"/><text x="320" text-anchor="middle" y="718" font-size="21" fill="#fff" font-weight="700">Open Content Studio</text><text x="32" y="761" font-size="15" fill="#64748b">Illustrative form · open the linked official page</text></g></svg>
