<svg xmlns="http://www.w3.org/2000/svg" width="880" height="638" viewBox="0 0 880 638"><rect width="100%" height="100%" rx="20" fill="#10243b"/><g font-family="Arial,sans-serif"><text x="32" y="48" font-size="27" font-weight="bold" fill="white">Verify before enabling automation</text><rect x="32" y="76" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="103" font-size="19" font-weight="bold" fill="#10243b">01  Dry run</text><text x="52" y="128" font-size="16" fill="#34546a">Create today's UTC queue JSON; leave LIVE_PUBLISH unset.</text><rect x="32" y="164" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="191" font-size="19" font-weight="bold" fill="#10243b">02  Expected dry-run log</text><text x="52" y="216" font-size="16" fill="#34546a">Dry run: queue and visual validated; no network request</text><rect x="32" y="252" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="279" font-size="19" font-weight="bold" fill="#10243b">03  Live test — explicit opt-in</text><text x="52" y="304" font-size="16" fill="#34546a">Set LIVE_PUBLISH=true only after reviewing account and content.</text><rect x="32" y="340" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="367" font-size="19" font-weight="bold" fill="#10243b">04  Expected receipt (illustrative)</text><text x="52" y="392" font-size="16" fill="#34546a">status: published · post_id: returned URN · visual: true</text><rect x="32" y="428" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="455" font-size="19" font-weight="bold" fill="#10243b">05  Confirm independently</text><text x="52" y="480" font-size="16" fill="#34546a">Check actual LinkedIn post and image; rerun must not duplicate.</text><rect x="32" y="516" width="816" height="70" rx="10" fill="#eaf4fa"/><text x="52" y="543" font-size="19" font-weight="bold" fill="#10243b">06  Unattended test</text><text x="52" y="568" font-size="16" fill="#34546a">Verify scheduler creates the queue without manual approval.</text></g></svg>